<svg width="120" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Company Name -->
  <text x="60" y="25" font-size="28" font-family="Arial, sans-serif" font-weight="bold" fill="#000080" text-anchor="middle" alignment-baseline="middle">SriKRG</text>
  
  <!-- Krishna's Flute with Hanging Beads -->
  <g transform="translate(60, 55)">
    <!-- Flute body -->
    <rect x="-35" y="-3" width="70" height="6" rx="3" fill="#8B4513"/>
    
    <!-- Flute holes -->
    <circle cx="-20" cy="0" r="2" fill="#654321"/>
    <circle cx="-7" cy="0" r="2" fill="#654321"/>
    <circle cx="7" cy="0" r="2" fill="#654321"/>
    <circle cx="20" cy="0" r="2" fill="#654321"/>
    
    <!-- Decorative bands -->
    <rect x="-30" y="-4" width="3" height="8" fill="#FFD700"/>
    <rect x="27" y="-4" width="3" height="8" fill="#FFD700"/>
    
    <!-- Hanging beads from left end -->
    <line x1="-35" y1="3" x2="-35" y2="15" stroke="#8B4513" stroke-width="1"/>
    <circle cx="-35" cy="16" r="2" fill="#FF6B6B"/>
    <circle cx="-35" cy="20" r="1.5" fill="#4ECDC4"/>
    <circle cx="-35" cy="23" r="1" fill="#45B7D1"/>
    
    <!-- Hanging beads from right end -->
    <line x1="35" y1="3" x2="35" y2="18" stroke="#8B4513" stroke-width="1"/>
    <circle cx="35" cy="19" r="2" fill="#96CEB4"/>
    <circle cx="35" cy="23" r="1.5" fill="#FFEAA7"/>
    <circle cx="35" cy="26" r="1" fill="#DDA0DD"/>
  </g>
</svg>
